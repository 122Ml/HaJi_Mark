name: Repository checks

on:
  pull_request:
    branches: [main, codex/integration]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [codex/integration, codex/platform-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collaboration-check:
    name: collaboration-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start vector-enabled test database and Redis
        run: |
          docker build -t hajimark-postgres:ci backend/docker/postgres
          docker run -d --name hajimark-test-db -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=hajimark_test -e POSTGRES_PASSWORD=ci-only-test -e POSTGRES_DB=hajimark_test \
            --health-cmd 'pg_isready -U hajimark_test -d hajimark_test' \
            --health-interval 2s --health-timeout 3s --health-retries 30 hajimark-postgres:ci
          docker run -d --name hajimark-test-redis -p 127.0.0.1:6379:6379 \
            --health-cmd 'redis-cli ping' \
            --health-interval 2s --health-timeout 3s --health-retries 20 redis:7.4.10
          for attempt in $(seq 1 35); do
            db_h=$(docker inspect --format '{{.State.Health.Status}}' hajimark-test-db)
            rd_h=$(docker inspect --format '{{.State.Health.Status}}' hajimark-test-redis)
            if [ "$db_h" = healthy ] && [ "$rd_h" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs hajimark-test-db
          docker logs hajimark-test-redis
          exit 1
      - name: Check review owner and merge direction
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          owners = [
              line.strip()
              for line in Path(".github/CODEOWNERS").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if owners != ["* @122Ml"]:
              raise SystemExit("All files must remain owned by @122Ml.")
          if os.environ["EVENT_NAME"] == "pull_request" and os.environ["PR_BASE"] == "main":
              if os.environ["PR_HEAD"] != "codex/integration" or os.environ["PR_HEAD_REPO"] != os.environ["REPOSITORY"]:
                  raise SystemExit("Only this repository's codex/integration may be merged into main.")
          print("Review owner and merge direction are valid.")
          PY
      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --format= --check HEAD
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend and parser checks
        working-directory: backend
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
          TEST_DATABASE_URL: postgres://hajimark_test:ci-only-test@localhost:5432/hajimark_test?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
          REQUIRE_INTEGRATION_TESTS: '1'
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build ./cmd/api ./cmd/worker ./cmd/seed-s1
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.30.0 generate
          git diff --exit-code -- internal/store
          python -m pip install pillow python-pptx
          python -m unittest tools/parser/test_parse.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks
        run: |
          npm --prefix web ci
          npm --prefix web run build
          npx --prefix web tsc --noEmit
          node scripts/check-frontend-ui.cjs
          node --test scripts/auto-demo/core.test.cjs
      - name: Documents, scripts, and compose validation
        env:
          POSTGRES_PASSWORD: ci-config-check-password
          POSTGRES_IMAGE: hajimark-postgres:ci
          BACKEND_IMAGE: hajimark-backend:ci
          WORKER_IMAGE: hajimark-worker:ci
          WEB_IMAGE: hajimark-web:ci
        run: |
          python scripts/api-inventory.py --check
          python scripts/check_docs.py
          for f in deploy/*.sh; do
            test -s "$f"
            ! grep -q $'\r' "$f"
            case "$(head -n1 "$f")" in
              '#!/bin/sh') sh -n "$f" ;;
              '#!/bin/bash') bash -n "$f" ;;
              *) echo "Unexpected shebang in $f" >&2; exit 1 ;;
            esac
          done
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.rag.yaml config --quiet
          docker compose -f deploy/compose.production.yaml config --quiet
