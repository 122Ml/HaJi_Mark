name: hajimark

x-backend: &backend
  image: hajimark-backend:local
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER:-hajimark}:${POSTGRES_PASSWORD:-local-dev-change-me}@postgres:5432/${POSTGRES_DB:-hajimark}?sslmode=disable
    REDIS_ADDR: redis:6379
    GIN_MODE: release
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_ENABLED: ${AI_ENABLED:-false}

services:
  postgres:
    image: hajimark-postgres:18.1-vector0.8.7
    build: ./backend/docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hajimark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-hajimark}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4.10
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    <<: *backend
    command: [./goose, -dir, db/migrations, up]
    environment:
      <<: *backend-env
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-hajimark}:${POSTGRES_PASSWORD:-local-dev-change-me}@postgres:5432/${POSTGRES_DB:-hajimark}?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    command: [./api]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/health/ready]
      interval: 3s
      timeout: 3s
      retries: 12
      start_period: 3s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *backend
    command: [./worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    image: hajimark-web:local
    build: ./web
    ports: ['127.0.0.1:${WEB_PORT:-18080}:80']
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:80/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      api: {condition: service_healthy}
  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: build
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-hajimark}:${POSTGRES_PASSWORD:-local-dev-change-me}@postgres:5432/${POSTGRES_DB:-hajimark}?sslmode=disable
      TEST_REDIS_ADDR: redis:6379
      REQUIRE_INTEGRATION_TESTS: ${REQUIRE_INTEGRATION_TESTS:-0}
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
    command: [sh, -c, 'go test -count=1 ./... && go vet ./...']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  seed:
    profiles: [demo]
    image: postgres:18.1-alpine3.23
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
      PGUSER: ${POSTGRES_USER:-hajimark}
      PGDATABASE: ${POSTGRES_DB:-hajimark}
      PGHOST: postgres
    volumes: [./backend/db/seeds/demo.sql:/demo.sql:ro]
    command: [psql, -v, ON_ERROR_STOP=1, -f, /demo.sql]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  postgres-data:
  redis-data:
