server {
    listen 80;
    listen [::]:80;
    server_name hajistudy.online;
    location ^~ /.well-known/acme-challenge/ {
        root /www/hajistudy-acme;
        try_files $uri =404;
    }
    location / { return 301 https://hajistudy.online$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hajistudy.online;
    ssl_certificate /www/letsencrypt/live/hajistudy.online/fullchain.pem;
    ssl_certificate_key /www/letsencrypt/live/hajistudy.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hajimark_tls:1m;
    ssl_session_timeout 1d;
    client_max_body_size 310m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /design-atlas {
        return 301 /design-atlas/;
    }
    location ^~ /design-atlas/ {
        root /www/hajimark-static;
        index index.html;
        autoindex off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; frame-ancestors 'self'" always;
        try_files $uri $uri/ =404;
    }
    location = /diagrams {
        return 301 /diagrams/;
    }
    location ^~ /diagrams/ {
        root /www/hajimark-static;
        index index.html;
        autoindex off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; frame-ancestors 'self'" always;
        try_files $uri $uri/ =404;
    }
    location ~ ^/api/v1/learning/courses/[^/]+/agent/conversations/[^/]+/events$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
