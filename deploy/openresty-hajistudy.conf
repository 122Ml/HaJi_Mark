server {
    listen 80;
    listen [::]:80;
    server_name hajistudy.online;
    location ^~ /.well-known/acme-challenge/ {
        root /www/hajistudy-acme;
        try_files $uri =404;
    }
    location / { return 301 https://hajistudy.online$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hajistudy.online;
    ssl_certificate /www/letsencrypt/live/hajistudy.online/fullchain.pem;
    ssl_certificate_key /www/letsencrypt/live/hajistudy.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hajimark_tls:1m;
    ssl_session_timeout 1d;
    client_max_body_size 310m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /design-atlas {
        return 301 /design-atlas/;
    }
    location ^~ /design-atlas/ {
        root /www/hajimark-static;
        index index.html;
        autoindex off;
        try_files $uri $uri/ =404;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
