CE" stroke-width="2" /><text x="1412" y="595" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#005F58" font-weight="600">学习支持 Agent</text><text x="1412" y="628" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">可见资料问答／笔记／路径</text><text x="1412" y="658" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">正式证据／补学任务</text><polyline points="1580,700 1580,745 885,745" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><polyline points="885,745 885,790" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><rect x="40" y="790" width="1050" height="135" rx="14" fill="#FFF2DF" stroke="#B6D6CE" stroke-width="2" /><text x="62" y="825" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#005F58" font-weight="600">类型化工具与权限门禁</text><text x="62" y="858" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">只读：禁止写入  ·  自动审查：草稿自动、修改审批  ·  完整操作：白名单修改</text><text x="62" y="888" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">角色／课程／对象归属  ·  作答上下文隔离  ·  正式确认与发布始终审批</text><rect x="1160" y="790" width="630" height="135" rx="14" fill="#FFF2DF" stroke="#B6D6CE" stroke-width="2" /><text x="1182" y="825" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#005F58" font-weight="600">必要信息与操作决定</text><text x="1182" y="858" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">问题卡：补全信息与选项</text><text x="1182" y="888" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">审批卡：绑定确切参数、模式和业务快照</text><polyline points="1090,855 1160,855" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1790,855 1815,855 1815,140 1790,140" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5" /><polyline points="885,925 885,1000" fill="non