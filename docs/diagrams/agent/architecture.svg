eight="400">游标重放 · 心跳 · 重连</text><text x="62" y="328" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">非供应商 token 流</text><rect x="1390" y="230" width="400" height="120" rx="14" fill="#EAF3F9" stroke="#B6D6CE" stroke-width="2" /><text x="1412" y="265" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#005F58" font-weight="600">PostgreSQL 运行记录</text><text x="1412" y="298" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">对话 · 消息 · 运行 · 步骤</text><text x="1412" y="328" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">问题／审批 · 附件 · 事件</text><polyline points="560,290 440,290" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><polyline points="240,230 240,185" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1210,290 1390,290" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><text x="1225" y="275" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#426C64" font-weight="400">检查点／审计</text><polyline points="885,350 885,405" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><rect x="560" y="405" width="650" height="90" rx="14" fill="#FFFFFF" stroke="#B6D6CE" stroke-width="2" /><text x="582" y="440" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#005F58" font-weight="600">协调 Agent</text><text x="582" y="473" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#274944" font-weight="400">按目标单层、顺序委派；专家隔离上下文</text><polyline points="885,495 885,530 230,530 230,560" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><polyline points="885,530 680,530 680,560" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><polyline points="885,530 1130,530 1130,560" fill="none" stroke="#5B827A" stroke-width="2" marker-end="url(#arrow)" /><polyline points="885,530 1580,530 1