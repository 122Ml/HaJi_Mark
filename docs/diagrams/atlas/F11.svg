<text x="2020.0" y="2051" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label"></text>
<text x="1458" y="2209" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >assigned → submitted：学生提交</text>
<g class="state" data-state="reviewed">
<rect x="2338.5" y="2015" width="243.5" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="2460.25" y="2075" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >reviewed</text>
</g>
<path d="M2288.5,2065 H2338.5" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2313.5" y="2051" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label"></text>
<text x="1458" y="2244" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >submitted → reviewed：教师复查</text>
<text x="1454" y="2285" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >创建时验证学生在课程、关联资料与补练已发布。</text>
<text x="1454" y="2329" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >下发记录 assigned_at；学生本人只能从 assigned 提交完成说明。</text>
<text x="1454" y="2373" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >关联学习完成与正式补练提交必须发生在下发之后，旧证据不能替代。</text>
<text x="1454" y="2417" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >教师填写复查内容后 reviewed；继续跟进需另建任务，不自动证明效果。</text>
<text x="80" y="2748" font-size="20" fill="#58616A" font-weight="400" text-anchor="start" >核查：learning/http.go、assessment.go、question_bank.go、rubrics.go、feedback.go；db/queries/learning.sql；00001–00012 迁移</text>
<text x="80" y="2786" font-size="21" fill="#8A622E" font-weight="400" text-anchor="start" >原件解析、知识条目、处理任务和重评批次有各自生命周期，分别在 F06、F06-1、F09-1 与 F15 的详细图中展开。</text>
</g></svg>