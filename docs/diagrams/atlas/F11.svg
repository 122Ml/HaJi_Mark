</g>
<g class="state" data-state="published">
<rect x="509.3333333333333" y="1200" width="341.3333333333333" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="680.0" y="1260" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >published</text>
</g>
<path d="M459.3333333333333,1250 H509.3333333333333" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="484.3333333333333" y="1236" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label"></text>
<text x="118" y="1359" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >draft → published：教师发布</text>
<g class="state" data-state="closed">
<rect x="900.6666666666666" y="1200" width="341.3333333333333" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="1071.3333333333333" y="1260" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >closed</text>
</g>
<path d="M850.6666666666666,1250 H900.6666666666666" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="875.6666666666666" y="1236" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label"></text>
<text x="118" y="1394" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >published → closed：教师关闭</text>
<text x="114" y="1470" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >草稿可编辑；发布前校验题目、满分与可用题库/标准绑定。</text>
<text x="114" y="1514" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >发布固定任务版本；过截止时拒绝新提交，截止不自动改 closed。</text>
<text x="114" y="1558" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >发布和关闭是明确命令；closed 任务不再接受新的正式作答。</text>
<text x="114" y="1602" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >整组重评要求已关闭，不能用批次更改原题干、选项或满分。</text>
<rect x="1420" y="1065" width="1200" height="745" rx="10" fill="#FFFFFF" stroke="#CCD3D2" stroke-width="2"/>
<text x="1448" y="1114" font-size="29" fill="#242424" font-weight="650" text-anchor="start" >04  题目 / 参考解答 / 标准</text>
<text x="1448" y="1201" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >题目 state</text>
<rect x="1840" y="1165" width="220" height="70" rx="10" fill="#EAF1F5" stroke="#AFC9DA" />
<rect x="2260" y="1165" width="280" height="70" rx="10" fill="#EAF1F5" stroke="#AFC9DA" />
