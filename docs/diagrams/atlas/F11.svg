<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="2810" viewBox="0 0 2700 2810" role="img" aria-labelledby="title desc">
<title id="title">F11 六类对象生命周期与迁移关口</title><desc id="desc">每个箭头标出触发动作与前置条件；新修订另建对象，拒绝条件不会偷偷推进状态。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#85929B"/></marker></defs>
<g font-family="Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="2700" height="2810" rx="10" fill="#F7F6F2" stroke="none" />
<text x="80" y="76" font-size="40" fill="#242424" font-weight="700" text-anchor="start" >F11　六类对象生命周期与迁移关口</text>
<text x="2620" y="76" font-size="22" fill="#58616A" font-weight="400" text-anchor="end" >2026-11-12 · 本地代码</text>
<text x="80" y="130" font-size="25" fill="#58616A" font-weight="400" text-anchor="start" >每个箭头标出触发动作与前置条件；新修订另建对象，拒绝条件不会偷偷推进状态。</text>
<text x="80" y="180" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >绿色：当前可执行迁移　｜　灰色说明：未接通操作　｜　状态冲突时保留原状态、返回拒绝</text>
<rect x="80" y="250" width="1200" height="745" rx="10" fill="#FFFFFF" stroke="#CCD3D2" stroke-width="2"/>
<text x="108" y="299" font-size="29" fill="#242424" font-weight="650" text-anchor="start" >01  课程</text>
<g class="state" data-state="draft">
<rect x="118.0" y="385" width="537.0" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="386.5" y="445" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >draft</text>
</g>
<g class="state" data-state="published">
<rect x="705.0" y="385" width="537.0" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="973.5" y="445" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >published</text>
</g>
<path d="M655.0,435 H705.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="680.0" y="421" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label"></text>
<text x="118" y="544" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >draft → published：教师发布</text>
<text x="114" y="655" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >创建课程即 draft；教师拥有者由会话确定。</text>
<text x="114" y="699" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >发布只允许 draft → published；重复或过期状态不会重复推进。</text>
<text x="114" y="743" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >课程成员、目录和内容是独立对象，不因课程发布而自动发布。</text>
<text x="114" y="787" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >当前没有课程 archived 或自动关闭的生命周期操作。</text>
<rect x="1420" y="250" width="1200" height="745" rx="10" fill="#FFFFFF" stroke="#CCD3D2" stroke-width="2"/>
<text x="1448" y="299" font-size="29" fill="#242424" font-weight="650" text-anchor="start" >02  学习资料</text>
<g class="state" data-state="draft">
<rect x="1458.0" y="385" width="537.0" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="1726.5" y="445" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >draft</text>
</g>
<g class="state" data-state="published">
<rect x="2045.0" y="385" width="537.0" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="2313.5" y="445" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >published</text>
</g>
<path d="M1995.0,435 H2045.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2020.0" y="421" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label"></text>
<text x="1458" y="544" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >draft → published：教师审核发布</text>
<text x="1454" y="655" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >手工资料先 draft；从核对片段发布时在同事务内创建并发布。</text>
<text x="1454" y="699" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >原件须 active、解析 ready；所选片段属于当前修订且质量 ready。</text>
<text x="1454" y="743" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >发布正文后修订另建版本，supersedes 保留旧文与历史引用。</text>
<text x="1454" y="787" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >resources 虽允许 archived，但当前没有资料归档接口；不画已实现箭头。</text>
<rect x="80" y="1065" width="1200" height="745" rx="10" fill="#FFFFFF" stroke="#CCD3D2" stroke-width="2"/>
<text x="108" y="1114" font-size="29" fill="#242424" font-weight="650" text-anchor="start" >03  作业 / 测验</text>
<g class="state" data-state="draft">
<rect x="118.0" y="1200" width="341.3333333333333" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
