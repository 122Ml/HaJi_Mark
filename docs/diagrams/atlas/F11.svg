<text x="2160.0" y="1186" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">分别人工确认</text>
<text x="1448" y="1317" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >参考解答 reference_state</text>
<rect x="1840" y="1281" width="220" height="70" rx="10" fill="#EAF1F5" stroke="#AFC9DA" />
<rect x="2260" y="1281" width="280" height="70" rx="10" fill="#EAF1F5" stroke="#AFC9DA" />
<text x="1950" y="1325" font-size="24" fill="#242424" font-weight="400" text-anchor="middle" >draft</text>
<text x="2400" y="1325" font-size="24" fill="#242424" font-weight="400" text-anchor="middle" >confirmed</text>
<path d="M2060,1316 H2260" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2160.0" y="1302" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">分别人工确认</text>
<text x="1448" y="1433" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >评分标准 state</text>
<rect x="1840" y="1397" width="220" height="70" rx="10" fill="#EAF1F5" stroke="#AFC9DA" />
<rect x="2260" y="1397" width="280" height="70" rx="10" fill="#EAF1F5" stroke="#AFC9DA" />
<text x="1950" y="1441" font-size="24" fill="#242424" font-weight="400" text-anchor="middle" >draft</text>
<text x="2400" y="1441" font-size="24" fill="#242424" font-weight="400" text-anchor="middle" >confirmed</text>
<path d="M2060,1432 H2260" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2160.0" y="1418" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">分别人工确认</text>
<text x="1454" y="1543" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >三条确认链独立；采纳候选不会替代任何一个确认动作。</text>
<text x="1454" y="1587" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >题目确认核对题意；解答有独立 reference_state，不向学生公开。</text>
<text x="1454" y="1631" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >标准确认校验逐点满分与真实依据，必须归属确切题目版本。</text>
<text x="1454" y="1675" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >确认对象不可就地覆盖；后续改动另建版本，不改已发布作业绑定。</text>
<rect x="80" y="1880" width="1200" height="745" rx="10" fill="#FFFFFF" stroke="#CCD3D2" stroke-width="2"/>
<text x="108" y="1929" font-size="29" fill="#242424" font-weight="650" text-anchor="start" >05  评分修订</text>
<g class="state" data-state="draft">
<rect x="118.0" y="2015" width="341.3333333333333" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="288.66666666666663" y="2075" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >draft</text>
</g>
<g class="state" data-state="confirmed">
<rect x="509.3333333333333" y="2015" width="341.3333333333333" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="680.0" y="2075" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >confirmed</text>
</g>
<path d="M459.3333333333333,2065 H509.3333333333333" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="484.3333333333333" y="2051" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label"></text>
<text x="118" y="2174" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >draft → confirmed：教师确认最新修订</text>
<g class="state" data-state="released">
<rect x="900.6666666666666" y="2015" width="341.3333333333333" height="100" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="1071.3333333333333" y="2075" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >released</text>
</g>
<path d="M850.6666666666666,2065 H900.6666666666666" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="875.6666666666666" y="2051" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label"></text>
<text x="118" y="2209" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >confirmed → released：教师单独发布</text>
<text x="114" y="2285" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >主观题先保存 draft；AI task succeeded 不是评分 released。</text>
<text x="114" y="2329" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >两次迁移均锁定并重查状态、最新修订及整组重评管理边界。</text>
<text x="114" y="2373" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >更正追加下一评分修订；旧 released 保留，不原地退回 draft。</text>
<text x="114" y="2417" font-size="22" fill="#58616A" font-weight="400" text-anchor="start" >客观 quiz 例外：按教师固定答案在提交事务内直接生成 released 规则结果。</text>
<rect x="1420" y="1880" width="1200" height="745" rx="10" fill="#FFFFFF" stroke="#CCD3D2" stroke-width="2"/>
<text x="1448" y="1929" font-size="29" fill="#242424" font-weight="650" text-anchor="start" >06  教师干预任务</text>
<g class="state" data-state="draft">
