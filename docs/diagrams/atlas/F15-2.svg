<path d="M785.0,2373 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="2359" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">当前修订与质量通过后，选段或全文发布</text>
<text x="80" y="2502" font-size="23" fill="#8A622E" font-weight="400" text-anchor="start" >任务 succeeded 与片段可靠是两回事；原文发布、直接索引和知识提炼分别发生。文件字节保存在共享卷，不放进 Redis。</text>
<text x="80" y="2569" font-size="20" fill="#58616A" font-weight="400" text-anchor="start" >源码核查：learning/materials.go；rag/jobs.go:{CreateJob,Recover,Process,Parse}；tools/parser/parse.py</text>
