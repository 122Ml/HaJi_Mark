<text x="2620" y="76" font-size="22" fill="#58616A" font-weight="400" text-anchor="end" >2026-11-12 · 本地代码</text>
<text x="80" y="130" font-size="25" fill="#58616A" font-weight="400" text-anchor="start" >从上到下读取真实调用；实线请求、虚线返回；分支文字说明拒绝、回滚、重试与人工兜底。</text>
