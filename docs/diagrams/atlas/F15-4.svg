<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="3711" viewBox="0 0 2700 3711" role="img" aria-labelledby="title desc">
<title id="title">F15-4 整组重评：冻结、逐份确认与原子发布</title><desc id="desc">从上到下读取真实调用；实线请求、虚线返回；分支文字说明拒绝、回滚、重试与人工兜底。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#85929B"/></marker></defs>
<g font-family="Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="2700" height="3711" rx="10" fill="#F7F6F2" stroke="none" />
<text x="80" y="76" font-size="40" fill="#242424" font-weight="700" text-anchor="start" >F15-4　整组重评：冻结、逐份确认与原子发布</text>
<text x="2620" y="76" font-size="22" fill="#58616A" font-weight="400" text-anchor="end" >2026-11-12 · 本地代码</text>
<text x="80" y="130" font-size="25" fill="#58616A" font-weight="400" text-anchor="start" >从上到下读取真实调用；实线请求、虚线返回；分支文字说明拒绝、回滚、重试与人工兜底。</text>
<text x="80" y="185" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >时序分图 4/4</text>
<rect x="90" y="338" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="371" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >A　冻结一个关闭作业的一道题</text>
<rect x="90" y="936" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="969" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >loop 批次中每一份有效提交</text>
<rect x="125" y="1022" width="2450" height="65" rx="10" fill="#FFF3E4" stroke="#E1C59E" />
<text x="145" y="1054" font-size="22" fill="#8A622E" font-weight="400" text-anchor="start" >教师可直接人工评分；以下 AI 草稿为可选分支，不替代人工核对与确认。</text>
<rect x="90" y="1748" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="1781" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >B　统一发布：一个事务检查所有成员</text>
<rect x="125" y="2146" width="2450" height="65" rx="10" fill="#FFF3E4" stroke="#E1C59E" />
<text x="145" y="2178" font-size="22" fill="#8A622E" font-weight="400" text-anchor="start" >任一不符 → 409 regrade_conflict + 全组回滚；学生继续看到旧结果，没有部分新成绩。</text>
<rect x="90" y="2664" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="2697" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >C　读端下一次请求读取正式结果</text>
<rect x="90" y="3158" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="3191" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >alt 教师取消 active 批次</text>
<rect x="45.0" y="240" width="350" height="82" rx="10" fill="#303235" stroke="#303235" stroke-width="2"/>
<text x="220.0" y="291" font-size="25" fill="#FFFFFF" font-weight="650" text-anchor="middle" >教师浏览器</text>
<line x1="220.0" y1="322" x2="220.0" y2="3451" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="610.0" y="240" width="350" height="82" rx="10" fill="#FFFFFF" stroke="#BFCACB" stroke-width="2"/>
<text x="785.0" y="291" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >API / regrade</text>
<line x1="785.0" y1="322" x2="785.0" y2="3451" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="1175.0" y="240" width="350" height="82" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="1350.0" y="291" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >PostgreSQL 事务</text>
<line x1="1350.0" y1="322" x2="1350.0" y2="3451" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="1740.0" y="240" width="350" height="82" rx="10" fill="#FFFFFF" stroke="#BFCACB" stroke-width="2"/>
<text x="1915.0" y="291" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >评分草稿任务</text>
<line x1="1915.0" y1="322" x2="1915.0" y2="3451" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="2305.0" y="240" width="350" height="82" rx="10" fill="#F0F0EA" stroke="#BCC3BA" stroke-width="2"/>
<text x="2480.0" y="291" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >正式结果读端</text>
<line x1="2480.0" y1="322" x2="2480.0" y2="3451" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<path d="M220.0,463 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="502.5" y="449" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">预览题目、统一新标准或更正客观答案</text>
<path d="M785.0,567 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="553" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">锁作业；校验 closed、同题干/题型/选项/满分</text>
<path d="M785.0,671 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="657" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">读取每人最新正式提交；未交不补零分</text>
<path d="M220.0,775 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="502.5" y="761" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">确认创建批次与原因</text>
<path d="M785.0,879 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="865" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">冻结名单、原文哈希、题目快照和评分 baseline</text>
<path d="M220.0,1171 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="502.5" y="1157" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">可选：请求批次条目的 AI 评分草稿</text>
<path d="M785.0,1275 H1915.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1350.0" y="1261" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">冻结原文 + 本批次统一标准</text>
<path d="M1915.0,1379 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="1350.0" y="1365" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">返回逐点候选；不发布</text>
<path d="M785.0,1483 H220.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="502.5" y="1469" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">教师轮询任务后核对候选</text>
<path d="M220.0,1587 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="502.5" y="1573" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">保存逐份评分并确认；edit_version 防止旧编辑覆盖</text>
<path d="M785.0,1691 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="1677" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">写 regrade_items；confirmed=true</text>
<path d="M220.0,1873 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="502.5" y="1859" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">POST batch state=released</text>
<path d="M785.0,1977 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="1963" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">BEGIN；锁批次和作业；重查题目快照与证据资格</text>
<path d="M785.0,2081 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="2067" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">重查名单、哈希、全部 confirmed、最新评分 baseline</text>
<path d="M785.0,2295 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="2281" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">为每份追加 draft → confirmed → released 修订</text>
<path d="M785.0,2399 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="2385" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">关联批次、标 graded、批次 released；COMMIT</text>
<path d="M1350.0,2503 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="1067.5" y="2489" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">成功；重复同状态命令幂等返回</text>
<path d="M785.0,2607 H220.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="502.5" y="2593" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">返回统一发布成功</text>
<path d="M2480.0,2789 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1632.5" y="2775" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">GET 本人反馈或授权学情 / CSV</text>
<path d="M785.0,2893 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="2879" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">查询已发布评分修订</text>
<path d="M1350.0,2997 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="1067.5" y="2983" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">返回全组提交后的正式结果</text>
<path d="M785.0,3101 H2480.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="1632.5" y="3087" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">按角色裁剪后的正式结果</text>
<path d="M220.0,3283 H785.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="502.5" y="3269" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">state=canceled</text>
<path d="M785.0,3387 H1350.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1067.5" y="3373" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">保留批次与旧结果；不发布草稿</text>
<text x="80" y="3516" font-size="23" fill="#8A622E" font-weight="400" text-anchor="start" >不改旧题目绑定、不覆盖原始作答、不自动跨作业重评。进入重评管理后普通评分不能绕过批次继续更正；此处没有主动推送。</text>
<text x="80" y="3583" font-size="20" fill="#58616A" font-weight="400" text-anchor="start" >源码核查：learning/regrade.go:{createRegrade,regradeAI,saveRegradeItem,regradeState,publishRegrade}；db/queries/material_workflows.sql</text>
</g></svg>