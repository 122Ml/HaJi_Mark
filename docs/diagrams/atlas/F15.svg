<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="2573" viewBox="0 0 2700 2573" role="img" aria-labelledby="title desc">
<title id="title">F15 正式提交：幂等、冻结与事务回执</title><desc id="desc">从上到下读取真实调用；实线请求、虚线返回；分支文字说明拒绝、回滚、重试与人工兜底。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#85929B"/></marker></defs>
<g font-family="Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="2700" height="2573" rx="10" fill="#F7F6F2" stroke="none" />
<text x="80" y="76" font-size="40" fill="#242424" font-weight="700" text-anchor="start" >F15　正式提交：幂等、冻结与事务回执</text>
<text x="2620" y="76" font-size="22" fill="#58616A" font-weight="400" text-anchor="end" >2026-11-12 · 本地代码</text>
<text x="80" y="130" font-size="25" fill="#58616A" font-weight="400" text-anchor="start" >从上到下读取真实调用；实线请求、虚线返回；分支文字说明拒绝、回滚、重试与人工兜底。</text>
<text x="80" y="185" font-size="22" fill="#187653" font-weight="400" text-anchor="start" >时序分图 1/4</text>
<rect x="90" y="338" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="371" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >A　授权与输入边界</text>
<rect x="90" y="728" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="761" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >alt 已存在同请求号</text>
<rect x="125" y="1022" width="2450" height="65" rx="10" fill="#FFF3E4" stroke="#E1C59E" />
<text x="145" y="1054" font-size="22" fill="#8A622E" font-weight="400" text-anchor="start" >同请求号改变正文或题目 → 409 request_conflict；旧提交不变。</text>
<rect x="90" y="1124" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="1157" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >else 新请求：重新检查提交窗口</text>
<rect x="125" y="1314" width="2450" height="65" rx="10" fill="#FFF3E4" stroke="#E1C59E" />
<text x="145" y="1346" font-size="22" fill="#8A622E" font-weight="400" text-anchor="start" >非 published、过截止或题目不属于作业 → 拒绝；事务回滚，不产生新提交。</text>
<rect x="90" y="1624" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="1657" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >opt 客观 quiz</text>
<rect x="90" y="1806" width="2520" height="49" rx="10" fill="#E7EAE5" stroke="#C4CECA" />
<text x="112" y="1839" font-size="23" fill="#242424" font-weight="600" text-anchor="start" >B　成功回执只在 COMMIT 之后</text>
<rect x="125" y="2204" width="2450" height="65" rx="10" fill="#FFF3E4" stroke="#E1C59E" />
<text x="145" y="2236" font-size="22" fill="#8A622E" font-weight="400" text-anchor="start" >回执丢失时用原 request_id 重发；再次作答必须用新请求号并重新通过窗口检查。</text>
<rect x="45.0" y="240" width="350" height="82" rx="10" fill="#F0F0EA" stroke="#BCC3BA" stroke-width="2"/>
<text x="220.0" y="291" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >学生浏览器</text>
<line x1="220.0" y1="322" x2="220.0" y2="2313" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="798.3333333333334" y="240" width="350" height="82" rx="10" fill="#FFFFFF" stroke="#BFCACB" stroke-width="2"/>
<text x="973.3333333333334" y="291" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >Gin / identity</text>
<line x1="973.3333333333334" y1="322" x2="973.3333333333334" y2="2313" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="1551.6666666666667" y="240" width="350" height="82" rx="10" fill="#FFFFFF" stroke="#BFCACB" stroke-width="2"/>
<text x="1726.6666666666667" y="291" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >learning.submit</text>
<line x1="1726.6666666666667" y1="322" x2="1726.6666666666667" y2="2313" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="2305.0" y="240" width="350" height="82" rx="10" fill="#EAF1F5" stroke="#AFC9DA" stroke-width="2"/>
<text x="2480.0" y="291" font-size="25" fill="#242424" font-weight="650" text-anchor="middle" >PostgreSQL 事务</text>
<line x1="2480.0" y1="322" x2="2480.0" y2="2313" stroke="#BCC7C6" stroke-width="2" stroke-dasharray="9 8"/>
<path d="M220.0,463 H973.3333333333334" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="596.6666666666667" y="449" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">POST /assignments/:id/submissions</text>
<path d="M973.3333333333334,567 H1726.6666666666667" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="1350.0" y="553" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">Session / CSRF / 学生 / 课程归属</text>
<path d="M1726.6666666666667,671 H2480.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2103.3333333333335" y="657" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">BEGIN；锁定作业；查询本人 request_id</text>
<path d="M2480.0,853 H1726.6666666666667" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="2103.3333333333335" y="839" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">同作业、同题目、同原文：返回旧提交</text>
<path d="M1726.6666666666667,957 H220.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="973.3333333333334" y="943" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">复用原回执；不增加 attempt</text>
<path d="M1726.6666666666667,1249 H2480.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2103.3333333333335" y="1235" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">重读 published / due_at / 任务版本 / 题目归属</text>
<path d="M1726.6666666666667,1463 H2480.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2103.3333333333335" y="1449" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">递增 attempt；写原文 + SHA256 + assignment_version</text>
<path d="M1726.6666666666667,1567 H2480.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2103.3333333333335" y="1553" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">同事务写 submission.submitted 学习事件</text>
<path d="M1726.6666666666667,1749 H2480.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2103.3333333333335" y="1735" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">固定答案规则 → released 修订；标记 graded</text>
<path d="M1726.6666666666667,1931 H2480.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
<text x="2103.3333333333335" y="1917" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">COMMIT；任一步数据库失败则整体回滚</text>
<path d="M2480.0,2035 H1726.6666666666667" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="2103.3333333333335" y="2021" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">返回已持久化提交与时间</text>
<path d="M1726.6666666666667,2139 H220.0" stroke="#85929B" stroke-width="2.6" fill="none" marker-end="url(#arr)" stroke-dasharray="9 6"/>
<text x="973.3333333333334" y="2125" font-size="21" fill="#58616A" font-weight="400" text-anchor="middle" class="message-label">正式回执；个人历史可查</text>
<text x="80" y="2378" font-size="23" fill="#8A622E" font-weight="400" text-anchor="start" >私人草稿 PUT 与正式提交 POST 分离；每次正式原文不可覆盖。主观题等待评阅，代码题不执行。</text>
<text x="80" y="2445" font-size="20" fill="#58616A" font-weight="400" text-anchor="start" >源码核查：learning/assessment.go:submit；drafts.go；db/queries/learning.sql</text>
</g></svg>