const figures=[{"id": "F01", "title": "系统上下文图", "question": "边界在哪，外面接了谁？", "evidence": "compose.yaml；compose.rag.yaml；deploy/compose.production.yaml；web/src/live/routes.tsx", "boundary": "图内的本地 RAG 能力不代表已部署公网。", "rows": 4}, {"id": "F02", "title": "概念 ER 图", "question": "业务对象之间是什么关系？", "evidence": "backend/db/migrations/00001–00012；backend/db/queries", "boundary": "这里是概念关系；具体外键和可空归属见 F14。", "rows": 6}, {"id": "F03", "title": "数据主题域图", "question": "数据分几个域，谁拥有写权？", "evidence": "backend/internal/identity；backend/internal/learning；backend/internal/rag；backend/db/queries", "boundary": "写权按当前处理器划分；单个数据库由 sqlc/store 访问。", "rows": 5}, {"id": "F04", "title": "总体结构图", "question": "系统分几块，谁依赖谁？", "evidence": "web/src/app/App.tsx；backend/internal/server；backend/cmd；compose.yaml；compose.rag.yaml", "boundary": "Python 只承担本地解析，不是独立业务服务。", "rows": 4}, {"id": "F05", "title": "总体流程图 v2", "question": "业务阶段怎么串，交接什么？", "evidence": "docs/architecture.md；backend/internal/learning/assessment.go；feedback.go；path.go", "boundary": "学情是已发布结果的证据汇总，不是能力预测。", "rows": 4}, {"id": "F06", "title": "工作流程：资料与知识", "question": "资料从导入到发布按什么顺序走？", "evidence": "backend/internal/learning/materials.go；knowledge_decisions.go；backend/internal/rag/jobs.go", "boundary": "公开URL只支持单页／直链；复杂版式与独立语义评价未完成。", "rows": 4}, {"id": "F07", "title": "工作流程：命题与标准", "question": "题目与标准怎么生成和冻结？", "evidence": "backend/internal/learning/question_bank.go；rubrics.go；paper.go；backend/db/migrations/00011_question_bank.sql", "boundary": "AI 只生成候选；没有原卷答案时不伪造提取结果。", "rows": 4}, {"id": "F08", "title": "工作流程：作答与提交", "question": "学生怎么作答，怎么算提交成功？", "evidence": "backend/internal/learning/assessment.go；drafts.go；backend/db/migrations/00003_learning_business.sql", "boundary": "自动保存草稿和正式提交是两个动作。", "rows": 4}, {"id": "F09", "title": "工作流程：评阅与发布", "question": "AI 评分到教师发布经过谁？", "evidence": "backend/internal/learning/feedback.go；rubrics.go；backend/internal/rag/jobs.go", "boundary": "AI 评分草稿不会自行发布。", "rows": 4}, {"id": "F10", "title": "工作流程：诊断与干预", "question": "诊断结果怎么变成干预动作？", "evidence": "backend/internal/learning/feedback.go；path.go；workspace.go；docs/architecture.md", "boundary": "现有路径是规则生成；不称为 AI 诊断。", "rows": 4}, {"id": "F11", "title": "六类生命周期", "question": "这些对象什么时候算完成？", "evidence": "backend/internal/learning/http.go；backend/db/migrations/00001_course_foundation.sql；00003_learning_business.sql；00009_structured_rubrics.sql", "boundary": "resources 表允许 archived，但当前无归档操作；不将其画为已接通迁移。", "rows": 6}, {"id": "F12", "title": "AI 能力边界与证据链", "question": "哪些交 AI，凭什么结论可信？", "evidence": "backend/internal/rag；backend/internal/learning/rubrics.go；backend/db/migrations/00010_materials_knowledge_rag.sql", "boundary": "引用和模型元数据支持追溯，不证明内容正确。", "rows": 4}, {"id": "F13", "title": "数据流图 DFD", "question": "数据在哪里产生、存放、消费？", "evidence": "compose.yaml；compose.rag.yaml；backend/db/migrations/00003_learning_business.sql；00010_materials_knowledge_rag.sql", "boundary": "Redis 承担队列；持久业务事实和任务记录在 PostgreSQL。", "rows": 4}, {"id": "F14", "title": "数据表关系图", "question": "当前数据库怎么建立主要关系？", "evidence": "backend/db/migrations/00001–00012；backend/db/queries", "boundary": "仅列主干；rubric_versions 互斥归属旧 questions 或新题库版本，约束见迁移。", "rows": 6}, {"id": "F15", "title": "关键时序图：四条调用", "question": "一次调用经过谁，失败怎么兜？", "evidence": "backend/internal/learning/assessment.go；regrade.go；backend/internal/rag/jobs.go；docs/research/three-module-acceptance-2026-11-12.md", "boundary": "生成任务中断不会自动重发未知模型调用。", "rows": 4}, {"id": "F16", "title": "接口关系图", "question": "谁调用谁，契约止于哪个边界？", "evidence": "web/src/shared/api.ts；backend/internal/learning/http.go；backend/internal/identity；backend/internal/rag；compose.yaml", "boundary": "学生与教师数据权限由服务端对象归属校验决定。", "rows": 4}, {"id": "F17", "title": "页面信息架构树", "question": "有哪些页面，分几层？", "evidence": "web/src/app/navigation.ts；web/src/live/routes.tsx；web/src/app/App.tsx", "boundary": "这是当前路由层级；历史 replica 页面不计入活动导航。", "rows": 4}, {"id": "F18", "title": "部署图", "question": "服务跑在哪，哪里跨信任边界？", "evidence": "deploy/compose.production.yaml；deploy/openresty-hajistudy.conf；compose.yaml；compose.rag.yaml", "boundary": "本地图册描述工作树；不把新功能画入现网旧镜像。", "rows": 4}, {"id": "F19", "title": "UML 包图：实现组织", "question": "代码里怎么组织？", "evidence": "web/src/app；web/src/live；web/src/shared；backend/internal；backend/db；backend/cmd", "boundary": "Go 项目用包与处理器组织；此图不是虚构的面向对象类层次。", "rows": 4}];const buttons=[...document.querySelectorAll('nav button')];function show(id){const f=figures.find(item=>item.id===id);if(!f)return;document.getElementById('title').textContent=f.id+' '+f.title;document.getElementById('question').textContent=f.question;document.getElementById('boundary').textContent='边界：'+f.boundary;document.getElementById('evidence').textContent='证据：'+f.evidence;const image=document.getElementById('image');image.src=f.id+'.svg';image.alt=f.id+' '+f.title+'：'+f.question;document.getElementById('svg').href=f.id+'.svg';document.getElementById('png').href=f.id+'.png';buttons.forEach(button=>button.setAttribute('aria-current',String(button.dataset.id===id)));history.replaceState(null,'','#'+id)}buttons.forEach(button=>button.addEventListener('click',()=>show(button.dataset.id)));show(location.hash.slice(1)||'F01');
</script></body></html>
