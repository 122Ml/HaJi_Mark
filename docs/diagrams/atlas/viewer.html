<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HaJi Mark · 详细设计图册 F01–F19</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px "Microsoft YaHei",sans-serif;color:#242424;background:#E4E3DE}body{display:flex;flex-direction:column}header{background:#282B2C;color:white;padding:13px 20px;display:flex;gap:8px 22px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}header p{margin:0;color:#D2DAD7;font-size:13px}main{display:grid;grid-template-columns:280px minmax(0,1fr);flex:1;min-height:0}nav{overflow:auto;padding:12px 8px;border-right:1px solid #BFC8C4;background:#F2F1ED}nav button{display:block;background:none;border:0;width:100%;text-align:left;padding:10px 12px;font:inherit;color:#303C3B;border-radius:5px;cursor:pointer}nav button:hover,nav button[aria-current=true]{background:#D9E6DF}article{min-width:0;min-height:0;display:flex;flex-direction:column}.tools{background:#F7F6F2;padding:12px 18px;border-bottom:1px solid #C4CBC7;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.tools button,.tools a,.tools select{font:inherit;background:#fff;border:1px solid #A4B4AE;color:#314940;border-radius:4px;padding:6px 10px;cursor:pointer;text-decoration:none}output{min-width:48px;text-align:center}.viewport{overflow:auto;flex:1;min-height:0;padding:24px;touch-action:pan-x pan-y}.sheet{margin:0 auto;transform-origin:0 0;background:#F7F6F2;box-shadow:0 2px 12px #0001}.sheet svg{display:block;width:100%;height:auto}.meta{background:#F7F6F2;border-top:1px solid #C4CBC7;padding:9px 18px;line-height:1.65;max-height:150px;overflow:auto}.meta p{margin:2px 0;color:#59635E}.meta strong{color:#885D29}details summary{cursor:pointer}#relations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px;padding-left:20px}.node{cursor:pointer}.node.selected>rect:first-of-type{stroke:#B64E21;stroke-width:5}.dim{opacity:.13}button:focus-visible,a:focus-visible,select:focus-visible,.node:focus-visible{outline:3px solid #B64E21;outline-offset:2px}.label-toggle .labels{display:none}.hint{color:#68746D;font-size:12px;margin-left:auto}.sheet[hidden]{display:none!important}@media(max-width:760px){header{padding:10px 12px}h1{font-size:17px}main{display:flex;flex-direction:column}nav{display:flex;flex:none;max-height:62px;overflow-x:auto;padding:5px;gap:4px;border:0;border-bottom:1px solid #BFC8C4}nav button{width:auto;white-space:nowrap;flex:none;padding:9px}article{flex:1}.viewport{padding:12px}.tools{padding:8px;gap:5px}.tools select{max-width:100%}.meta{max-height:120px;padding:8px 12px}#relations{grid-template-columns:1fr}.hint{display:none}}
</style></head><body><header><h1>HaJi Mark · 详细设计图册 F01–F19</h1><p>27 张图 · 本地工作树 2026-11-12 · 不等同于教师验收、AI 效果或公网部署</p></header>
<main><nav aria-label="图号"><!-- NAV --></nav><article><div class="tools"><select id="detail" aria-label="同编号详细分图"></select><button id="fit">适宽</button><button id="actual">原尺寸</button><button id="minus" aria-label="缩小">−</button><output id="level"></output><button id="plus" aria-label="放大">＋</button><button id="reset">显示全部关系</button><label><input type="checkbox" id="labels" checked>关系标签</label><a id="svg-link" download>SVG</a><a id="png-link" download>PNG</a><span class="hint">点击节点突出直接关联；Esc 清除</span></div><div class="viewport" tabindex="0" aria-label="可滚动放大图纸"><!-- SHEETS --></div><div class="meta"><p><strong id="boundary"></strong></p><p id="evidence"></p><details><summary id="stats"></summary><ul id="relations"></ul></details></div></article></main>
<script>
const figures=/* MANIFEST */;
const nav=[...document.querySelectorAll('nav button')],sheets=[...document.querySelectorAll('.sheet')],pane=document.querySelector('.viewport'),picker=document.querySelector('#detail');let active,scale=1;
function canvas(){return sheets.find(s=>s.dataset.sheet===active.id)}
function zoom(value){scale=Math.max(.12,Math.min(3,value));canvas().style.width=Math.round(active.width*scale)+'px';document.querySelector('#level').value=Math.round(scale*100)+'%'}
function fit(){zoom((pane.clientWidth-(innerWidth<760?24:48))/active.width)}
function highlight(key){const el=canvas(),wanted=key?[key]:[],near=new Set(wanted);el.querySelectorAll('.edge,.edge-label').forEach(e=>{const hit=!key||e.dataset.from===key||e.dataset.to===key;e.classList.toggle('dim',!hit);if(hit){near.add(e.dataset.from);near.add(e.dataset.to)}});el.querySelectorAll('.node').forEach(n=>{n.classList.toggle('dim',Boolean(key)&&!near.has(n.dataset.node));n.classList.toggle('selected',n.dataset.node===key)})}
function show(id){const f=figures.find(f=>f.id===id);if(!f)return;active=f;sheets.forEach(s=>s.hidden=s.dataset.sheet!==id);const root=id.split('-')[0];nav.forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===root)));picker.replaceChildren(...figures.filter(f=>f.id.split('-')[0]===root).map(f=>{const o=new Option(f.id+' '+f.title,f.id);o.selected=f.id===id;return o}));document.querySelector('#boundary').textContent='边界：'+f.boundary;document.querySelector('#evidence').textContent='源码核查：'+f.evidence;document.querySelector('#svg-link').href=id+'.svg';document.querySelector('#png-link').href=id+'.png';document.querySelector('#stats').textContent=f.nodes+' 个节点 / '+f.edges+' 条关系'+(f.physical_foreign_keys?'；本分图覆盖 '+f.physical_foreign_keys+' 条真实外键':'')+' · 展开查看关系';document.querySelector('#relations').replaceChildren(...(f.relations||[]).map(r=>{const li=document.createElement('li');const a=canvas().querySelector('[data-node="'+r.from+'"] .node-title'),b=canvas().querySelector('[data-node="'+r.to+'"] .node-title');li.textContent=(a?a.textContent:r.from)+' → '+(b?b.textContent:r.to)+(r.label?'：'+r.label:'');return li}));highlight();fit();pane.scrollTo(0,0);history.replaceState(null,'','#'+id)}
nav.forEach(b=>b.onclick=()=>show(b.dataset.id));picker.onchange=()=>show(picker.value);document.querySelector('#fit').onclick=fit;document.querySelector('#actual').onclick=()=>zoom(1);document.querySelector('#plus').onclick=()=>zoom(scale*1.25);document.querySelector('#minus').onclick=()=>zoom(scale/1.25);document.querySelector('#reset').onclick=()=>highlight();document.querySelector('#labels').onchange=e=>sheets.forEach(s=>s.classList.toggle('label-toggle',!e.target.checked));sheets.forEach(s=>s.querySelectorAll('.node').forEach(n=>{n.setAttribute('tabindex','0');n.setAttribute('role','button');const go=()=>highlight(n.classList.contains('selected')?null:n.dataset.node);n.addEventListener('click',go);n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})}));document.addEventListener('keydown',e=>{if(e.key==='Escape')highlight()});show(figures.some(f=>f.id===location.hash.slice(1))?location.hash.slice(1):'F01');
</script></body></html>
