const nav=document.querySelector('nav'),stage=document.querySelector('.stage'),details=document.querySelector('#details');
let current,scale=1;
document.querySelectorAll('.stage>svg').forEach((svg,i)=>{const panel=document.createElement('section');panel.className='panel';panel.id=manifest.figures[i].id;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','tab-'+panel.id);const canvas=document.createElement('div');canvas.className='canvas';svg.before(panel);canvas.append(svg);panel.append(canvas)});
function updateScale(value){scale=Math.max(.1,Math.min(2,value));const panel=document.getElementById(current.id),canvas=panel.querySelector('.canvas');canvas.style.transform=`scale(${scale})`;panel.style.width=current.width*scale+'px';panel.style.height=current.height*scale+'px';document.querySelector('#level').textContent=Math.round(scale*100)+'%'}
function fit(){updateScale((stage.clientWidth-32)/current.width)}
function clear(){document.querySelectorAll('.selected,.dim').forEach(n=>n.classList.remove('selected','dim'));details.replaceChildren();const title=document.createElement('strong');title.textContent=current.title;details.append(title);const p=document.createElement('p');p.textContent='点击节点查看关联操作，↗ 进入对应分图。';details.append(p);const routes=manifest.route_coverage.filter(r=>r.figure===current.id);const info=document.createElement('p');info.className='hint';info.textContent=routes.map(r=>(r.role==='teacher'?'教师':'学生')+' · '+r.title).join(' / ');details.append(info)}
function selectNode(key){clear();const node=current.nodes.find(n=>n.id===key);if(!node)return;const panel=document.getElementById(current.id),edges=current.edges.filter(e=>e.source===key||e.target===key),neighbors=new Set([key,...edges.flatMap(e=>[e.source,e.target])]);panel.querySelectorAll('.node').forEach(n=>{n.classList.toggle('dim',!neighbors.has(n.dataset.node));n.classList.toggle('selected',n.dataset.node===key)});panel.querySelectorAll('.edge,.edge-label').forEach(e=>{const selected=e.dataset.from===key||e.dataset.to===key;e.classList.toggle('dim',!selected);e.classList.toggle('selected',selected)});details.replaceChildren();const title=document.createElement('strong');title.textContent=node.title;details.append(title);const p=document.createElement('p');p.textContent=node.body.join('；');details.append(p);if(node.jump){const jump=document.createElement('button');jump.id='jump';jump.textContent='↗ '+manifest.figures.find(f=>f.id===node.jump).title;jump.onclick=()=>show(node.jump);details.append(jump)}for(const e of edges){const other=current.nodes.find(n=>n.id===(e.source===key?e.target:e.source));const b=document.createElement('button');b.className='relation';b.textContent=(e.source===key?'→ ':'← ')+other.title+(e.label?' · '+e.label:'');b.onclick=()=>selectNode(other.id);details.append(b)}}
function show(id){current=manifest.figures.find(f=>f.id===id)||manifest.figures[0];document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===current.id));nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===current.id)));document.querySelector('#png').href=current.id+'.png';document.querySelector('#svg').href=current.id+'.svg';document.querySelector('#info').textContent=current.nodes.length+' 个操作节点 · '+current.edges.length+' 条关系';history.replaceState(null,'','#'+current.id);stage.scrollTo(0,0);fit();clear()}
for(const f of manifest.figures){const b=document.createElement('button');b.id='tab-'+f.id;b.dataset.id=f.id;b.setAttribute('role','tab');b.setAttribute('aria-controls',f.id);b.textContent=f.id+' '+f.title;b.onclick=()=>show(f.id);nav.append(b)}
document.querySelectorAll('.node').forEach(n=>{n.addEventListener('click',()=>selectNode(n.dataset.node));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(n.dataset.node)}})});
document.querySelector('#fit').onclick=fit;document.querySelector('#plus').onclick=()=>updateScale(scale*1.25);document.querySelector('#minus').onclick=()=>updateScale(scale/1.25);document.querySelector('#reset').onclick=clear;document.addEventListener('keydown',e=>{if(e.key==='Escape')clear()});window.addEventListener('resize',fit);show(location.hash.slice(1)||'I00');
