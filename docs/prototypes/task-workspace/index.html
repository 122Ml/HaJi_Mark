<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HaJi Mark · 课程工作台交互原型</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#workspace">跳到主要内容</a>
  <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>
  <div class="app">
    <header class="topbar">
      <button class="icon-button mobile-menu" data-action="menu" aria-label="打开主导航">☰</button>
      <nav id="breadcrumb" aria-label="当前位置"></nav>
      <div class="top-actions">
        <span class="prototype-label">交互原型 · 示例数据</span>
        <button class="quiet" data-action="tasks" id="task-center"></button>
        <label class="sr-only" for="role">切换演示角色</label>
        <select id="role"><option value="teacher">教师视图</option><option value="student">学生视图</option></select>
        <span class="avatar" id="avatar" aria-hidden="true">师</span>
      </div>
    </header>
    <div class="page-layout" id="layout">
      <main id="workspace" tabindex="-1"></main>
      <aside id="assistant" class="assistant" aria-label="上下文助理"></aside>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
