<text x="150" y="718" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#19394b">手填标准，或AI仅依据题目资料起草</text>
<text x="150" y="769" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#19394b">教师编辑、校验分值并确认采用标准</text>
<text x="150" y="814" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#b36523">AI起草失败：可重试或手填</text>
