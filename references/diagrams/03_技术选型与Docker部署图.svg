<polyline points="900,955 900,1015 2280,1015 2280,1260 2240,1260" fill="none" stroke="#3a739b" stroke-width="4" stroke-linejoin="round"/>
<polygon points="2240,1260 2255.3076007399955,1252.605585920109 2255.3076007399955,1267.394414079891" fill="#3a739b"/>
<rect x="1903" y="973" width="149.0" height="37" rx="5" fill="#edf3f8" stroke="#edf3f8" stroke-width="2"/>
<text x="1910" y="1002" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#3a739b">API管理文件</text>
<rect x="1530" y="1510" width="720" height="130" rx="17" fill="#edf3f8" stroke="#adc3d2" stroke-width="2"/>
<text x="1890.0" y="1553.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#19394b">外部模型API</text>
<text x="1890.0" y="1592.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">Go net/http薄封装；密钥仅在后端配置</text>
<text x="1890.0" y="1629.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">标准起草和答案评阅使用不同输入</text>
<polyline points="2180,860 2360,860 2360,1575 2250,1575" fill="none" stroke="#3a739b" stroke-width="4" stroke-linejoin="round"/>
<polygon points="2250,1575 2265.3076007399955,1567.605585920109 2265.3076007399955,1582.394414079891" fill="#3a739b"/>
<rect x="2083" y="1450" width="134.0" height="37" rx="5" fill="#f5f7fb" stroke="#f5f7fb" stroke-width="2"/>
<text x="2090" y="1479" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#3a739b">调用／响应</text>
<rect x="100" y="1510" width="1300" height="130" rx="17" fill="white" stroke="#adc3d2" stroke-width="2"/>
<text x="750.0" y="1551.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#19394b">后台作业一致性</text>
<text x="750.0" y="1591.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#567080">PostgreSQL先保存作业，Redis投递；失败可按库中记录恢复。</text>
<text x="750.0" y="1629.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#567080">重复投递不覆盖人工确认；API快速返回作业编号，页面轮询进度。</text>
</svg>