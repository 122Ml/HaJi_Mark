<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
<rect width="100%" height="100%" fill="#f5f7fb"/>
<text x="80" y="92" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="47" font-weight="700" fill="#19394b">技术选型与Docker部署｜E6主观题AI辅助批改</text>
<text x="80" y="147" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#567080">已确定的实现方向；本次仅建立文档仓库，容器、接口和业务代码尚未实现。</text>
<rect x="690" y="210" width="1020" height="100" rx="17" fill="white" stroke="#adc3d2" stroke-width="2"/>
<text x="1200.0" y="255.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="33" font-weight="700" fill="#19394b">教师浏览器</text>
<text x="1200.0" y="297.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#567080">React＋TypeScript＋Ant Design</text>
<rect x="80" y="400" width="2240" height="1040" rx="17" fill="#edf3f8" stroke="#adc3d2" stroke-width="2"/>
<text x="120" y="470" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#19394b">Docker Compose｜同一应用的五个常驻服务</text>
<rect x="600" y="520" width="1200" height="125" rx="17" fill="white" stroke="#adc3d2" stroke-width="2"/>
<text x="1200.0" y="578.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#19394b">web：Nginx＋前端静态文件</text>
<text x="1200.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#567080">Vite构建；React Router路由；TanStack Query查询／轮询</text>
<polyline points="1200,310 1200,520" fill="none" stroke="#3a739b" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1200,520 1192.605585920109,504.6923992600045 1207.394414079891,504.6923992600045" fill="#3a739b"/>
<rect x="1223" y="335" width="156.015625" height="38" rx="5" fill="#f5f7fb" stroke="#f5f7fb" stroke-width="2"/>
<text x="1230" y="365" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#3a739b">HTTP(S)入口</text>
<rect x="220" y="780" width="850" height="175" rx="17" fill="white" stroke="#adc3d2" stroke-width="2"/>
<text x="645.0" y="844.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#19394b">api：Go＋Gin</text>
<text x="645.0" y="885.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#567080">任务与材料、发起批改、进度查询</text>
<text x="645.0" y="924.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#567080">逐份修订／确认／导出；教师会话与权限</text>
<rect x="1400" y="780" width="780" height="175" rx="17" fill="white" stroke="#adc3d2" stroke-width="2"/>
<text x="1790.0" y="845.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#19394b">worker：Go＋Asynq</text>
<text x="1790.0" y="885.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#567080">标准生成与逐份评阅；受控并发／重试</text>
<text x="1790.0" y="923.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#567080">两进程共用后端代码与镜像</text>
<polyline points="1200,645 1200,710 645,710 645,780" fill="none" stroke="#3a739b" stroke-width="4" stroke-linejoin="round"/>
<polygon points="645,780 637.6055859201091,764.6923992600045 652.3944140798909,764.6923992600045" fill="#3a739b"/>
<rect x="753" y="670" width="204.0" height="38" rx="5" fill="#edf3f8" stroke="#edf3f8" stroke-width="2"/>
<text x="760" y="700" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#3a739b">反向代理业务API</text>
<rect x="160" y="1170" width="650" height="190" rx="17" fill="white" stroke="#adc3d2" stroke-width="2"/>
<text x="485.0" y="1224.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#19394b">PostgreSQL</text>
<text x="485.0" y="1263.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">sqlc生成查询；pgx查询与事务</text>
<text x="485.0" y="1300.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">题目、标准、作答、作业、原稿与确认</text>
<text x="485.0" y="1337.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">Goose负责表结构迁移</text>
<rect x="875" y="1170" width="650" height="190" rx="17" fill="white" stroke="#adc3d2" stroke-width="2"/>
<text x="1200.0" y="1224.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#19394b">Redis</text>
<text x="1200.0" y="1263.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">Asynq队列：主要传作业ID</text>
<text x="1200.0" y="1300.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">会话／限流／必要短期缓存</text>
<text x="1200.0" y="1337.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">不作为正式成绩事实源</text>
<rect x="1590" y="1170" width="650" height="190" rx="17" fill="white" stroke="#adc3d2" stroke-width="2"/>
<text x="1915.0" y="1224.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#19394b">文件卷</text>
<text x="1915.0" y="1263.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">保留导入文件和确认结果导出</text>
<text x="1915.0" y="1300.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">数据库／Redis另有独立持久化卷</text>
<text x="1915.0" y="1337.5" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#567080">业务接口按任务关联文件</text>
