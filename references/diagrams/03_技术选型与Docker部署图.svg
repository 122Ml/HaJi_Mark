<polyline points="1525,1235 1550,1235 1550,955" fill="none" stroke="#b36523" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1550,955 1557.394414079891,970.3076007399955 1542.605585920109,970.3076007399955" fill="#b36523"/>
<rect x="1563" y="1045" width="193.984375" height="37" rx="5" fill="#edf3f8" stroke="#edf3f8" stroke-width="2"/>
<text x="1570" y="1074" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#b36523">Worker领取作业</text>
<polyline points="1720,955 1720,1100 700,1100 700,1170" fill="none" stroke="#087f79" stroke-width="4" stroke-linejoin="round"/>
